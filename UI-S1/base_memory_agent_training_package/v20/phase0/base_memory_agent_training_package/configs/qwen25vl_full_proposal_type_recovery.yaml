### model
model_name_or_path: checkpoints/Qwen2.5-VL-7B-Instruct
image_max_pixels: 1003520
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: train_GUI_360/llamafactory/ds_z3_config.json

### dataset
dataset: proposal_type_recovery_train
dataset_dir: train_GUI_360/llamafactory/data
template: qwen2_vl
cutoff_len: 4096
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: v20/phase0/output/full_proposal_type_recovery
logging_steps: 5
save_steps: 25
save_total_limit: 5
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none
run_name: full_proposal_type_recovery

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.1
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: proposal_type_recovery_dev
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 25
