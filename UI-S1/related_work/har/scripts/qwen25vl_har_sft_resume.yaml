### model - start from checkpoint-100 weights
model_name_or_path: /scratch/a5l/shuqing.a5l/MobileAgent/UI-S1/related_work/har/output/har_sft_checkpoint100
image_max_pixels: 1003520
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: train_GUI_360/llamafactory/ds_z3_config.json

### dataset
dataset: gui360_har_train
dataset_dir: related_work/har/data
template: qwen2_vl
cutoff_len: 8192
preprocessing_num_workers: 4
dataloader_num_workers: 4

### output
output_dir: related_work/har/output/har_sft_resume
logging_steps: 10
save_steps: 50
save_total_limit: 5
plot_loss: true
overwrite_output_dir: false
save_only_model: true
report_to: wandb
run_name: har_sft_resume

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.1
bf16: true
ddp_timeout: 180000000

### note: fresh start from ckpt-100 weights, ~3 more epochs to total ~4

### eval
eval_dataset: gui360_har_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
