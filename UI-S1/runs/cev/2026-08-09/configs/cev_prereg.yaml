  lineage_vote_default: candidate_votes_unlimited
granularity:
  G0: {action: exact, coordinate: ignored, parameter: ignored}
  G1: {action: exact, coordinate: tolerance, parameter: ignored}
  G2: {action: exact, coordinate: ignored, parameter: token_f1_threshold}
  G3: {action: exact, coordinate: tolerance, parameter: token_f1_threshold}
  G4: {action: ignored, coordinate: tolerance, parameter: ignored}
clustering:
  main: deterministic_greedy_complete_link
  rule: candidate_joins_first_existing_class_if_equivalent_to_every_member_else_new_class
  tie_break:
    - candidate_vote_count
    - summed_dev_reliability
    - maximum_member_dev_reliability
    - earliest_frozen_candidate_order
  sensitivity_only: single_link_connected_components
cev:
  fixed_endpoint:
    screenspot_pro: G4
    mind2web: nested_global_selection_from_G0_G3
cev_a:
  variants: [global, action_conditional]
  action_min_inner_validation_rows: 30
  sparse_action_backoff: global
  configuration_selection_metric: inner_validation_micro_accuracy
  granularity_tie_order: [G0, G4, G1, G2, G3]
  parameter_threshold_tie_order: [1.0, 0.75, 0.5]
  coordinate_multiplier_tie_order: [1.0, 0.75, 1.25, 0.5, 1.5, 2.0]
nested_protocol:
  outer_test_fold: k
  inner_validation_fold: (k_plus_1)_mod_5
  inner_training_folds: remaining_three
  fit_on_inner_training: [dev_reliability, coordinate_base_scale]
  select_on_inner_validation: [cev_configuration, cev_a_variant]
  refit_on_all_outer_development: true
  outer_test_access_during_selection: prohibited
dev_selection_control:
  mandatory: true
  candidate_aggregators: [majority, A0, ours, A1, A2, A3, A4]
  selection_metric: inner_validation_micro_accuracy
  tie_order: [majority, A0, ours, A1, A2, A3, A4]
statistics:
  paired_bootstrap_resamples: 10000
  confidence: 0.99
  interval: percentile
validations:
  V1:
    name: rowwise_A2_anchor
    condition: screenspot_G4_complete_candidate_votes_identical_to_A2_every_row
  V2:
    name: local_endpoint_noninferiority
    condition:
      - screenspot_CEV_A_minus_A2_ci_upper_nonnegative_or_abs_delta_below_mde
      - mind2web_CEV_A_minus_majority_ci_upper_nonnegative_or_abs_delta_below_mde
  V3:
    name: cross_endpoint_superiority
    condition:
      - screenspot_CEV_A_minus_majority_ci_lower_positive
      - mind2web_CEV_A_minus_sequential_ci_lower_positive
  V4:
    name: nested_dev_selection_comparison
    method_contribution: CEV_A_minus_devsel_ci_lower_positive_both_benchmarks
    explanatory_contribution: no_significant_deficit_and_each_abs_delta_below_mde_or_ci_includes_zero
    failed_unification: any_ci_upper_negative_and_abs_deficit_at_least_mde
predictions:
