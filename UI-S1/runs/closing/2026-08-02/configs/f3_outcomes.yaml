schema_version: 1
frozen_at_utc: "2026-08-02"
result_blind: true

source:
  repository: ZJU-REAL/UI-Zoomer
  commit: 2c1125067958df2468663004b2b4b7c50557da25
  implementation: UI-Zoomer/uizoomer.py
  model: Qwen/Qwen2.5-VL-7B-Instruct
