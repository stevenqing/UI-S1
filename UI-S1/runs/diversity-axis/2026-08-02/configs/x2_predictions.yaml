interaction:
  definition: (Q4_minus_Q3)_minus_(Q2_minus_Q1)
  near_additive: bootstrap_99pct_CI_contains_zero
  super_additive: bootstrap_99pct_CI_lower_bound_greater_than_zero
  sub_additive: bootstrap_99pct_CI_upper_bound_less_than_zero

predictions:
  highest_cell: Q4
  composability_success:
    - Q4_point_estimate_strictly_greater_than_Q1_Q2_Q3
    - interaction_is_near_additive_or_super_additive
  strongest_claim: interaction_near_additive
  stronger_claim: interaction_super_additive
  downgrade: interaction_sub_additive

kill_conditions:
  X-K1: interaction_bootstrap_99pct_CI_upper_bound_less_than_zero

execution_gate:
  require_zoom_method_status: READY_AMENDMENT_003_FIXED12_MICROCHAINS
  current_zoom_method_status: READY_AMENDMENT_003_FIXED12_MICROCHAINS
  no_X2_inference_until_gate_ready: false
