schema_version: 1
status: FROZEN_BEFORE_RESULTS
frozen_at: 2026-08-09
analysis_role: mandatory_nested_dev_selection_control
benchmarks: [mind2web, screenspot_pro]
arms:
  primary: C_uni
  robustness: [C_cond, C_rand, C_self]
outer_folds: 5
candidate_aggregators: [majority, A0, ours, A1, A2, A3, A4]
inner_split:
  strategy: one_rotating_existing_fold_as_validation
  validation_fold: (outer_fold_plus_1)_mod_5
  training_folds: remaining_three_folds
  no_outer_test_rows_in_selection: true
selection:
  metric: validation_micro_accuracy
  tie_break: frozen_candidate_aggregator_order
  inner_train_fits:
    - slot_priority
    - source_reliability
    - grounding_weights
  outer_refit: use_all_four_outer_dev_folds_after_aggregator_selection
evaluation:
  one_selected_aggregator_per_outer_fold: true
  outer_heldout_micro_accuracy: true
comparison:
  paired_bootstrap_resamples: 10000
  confidence: 0.99
  seeds:
    mind2web: 20260815
    screenspot_pro: 20260816
  interpretation:
    EQV_significantly_better: unified_method_contribution
    indistinguishable: explanatory_contribution_only
    EQV_significantly_worse: U_K3_unified_rule_fails
prohibitions:
  - no_test_fold_metric_in_selection
  - no_result_based_candidate_aggregator_change
  - no_skipping_mandatory_control