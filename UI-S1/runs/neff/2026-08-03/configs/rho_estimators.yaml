schema_version: 1
frozen_at_utc: "2026-08-03"
result_blind: true

kernel:
  type: gaussian_evaluator_kernel
  sigma_pixels: 14.0
  similarity: exp_negative_squared_distance_over_2_sigma_squared

estimators:
  failure_kappa:
    definition: mean_pairwise_cohen_kappa_of_binary_failure_vectors
    chance_corrected: true
    primary: true
  rho_geom:
    definition: mean_pairwise_kernel_similarity_over_all_rows_and_candidate_pairs
    conditioned_on_failure: false
  rho_cond:
    definition: mean_pairwise_kernel_similarity_over_row_pair_events_where_both_candidates_fail
    conditioned_on_failure: both_fail

neff:
  equicorrelation_formula: K_over_1_plus_K_minus_1_times_rho
  raw_rho_reported: true
  clipping: none
  fail_if_denominator_nonpositive: true

quality:
  definition: mean_full_bbox_containment_of_selected_shared_proposal_regions
  full_image_quality: measured_not_forced
  shared_model_views_use_same_region_quality: true
  source_7b: runs/allocation-law/2026-08-01/L4_RESULTS.json
  source_72b: runs/scaleup/2026-08-02/raw/g2-regions.jsonl

