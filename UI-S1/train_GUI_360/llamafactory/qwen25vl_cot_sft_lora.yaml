### model — start from balanced SFT checkpoint (already good at action prediction)
model_name_or_path: /scratch/a5l/shuqing.a5l/MobileAgent/UI-S1/train_GUI_360/llamafactory/output/gui360_balanced_full_sft/checkpoint-272
image_max_pixels: 1003520
video_max_pixels: 16384
trust_remote_code: true

### method — full fine-tuning with CoT data
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
deepspeed: train_GUI_360/llamafactory/ds_z3_config.json

### dataset — CoT augmented training data (67K steps with reasoning)
dataset: cot_sft_train
dataset_dir: train_GUI_360/llamafactory/data
template: qwen2_vl
cutoff_len: 8192
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: train_GUI_360/llamafactory/output/cot_sft_full
logging_steps: 10
save_steps: 50
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
run_name: cot_sft_full

### train — eff_bs = 4 nodes * 4 gpu * 2 * 4 = 128
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.1
bf16: true
ddp_timeout: 180000000

### eval — disabled (ZeRO-3 eval too slow)
eval_strategy: "no"
