### model — start from base Qwen2.5-VL-7B-Instruct
model_name_or_path: /scratch/a5l/shuqing.a5l/MobileAgent/UI-S1/checkpoints/Qwen2.5-VL-7B-Instruct
image_max_pixels: 1003520
video_max_pixels: 16384
trust_remote_code: true

### method — standard LoRA r=256 (parameter-matched to V13 cooperative)
# V13 cooperative: shared B + 2 A matrices, r=128, 4 modules -> ~154M LoRA params
# Standard LoRA r=256, 4 modules (q/k/v/o) -> ~205M params (slightly more, fair baseline)
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 256
lora_alpha: 512
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj
freeze_vision_tower: true
freeze_multi_modal_projector: true
gradient_checkpointing: true

### dataset — balanced 2000-episode data (17K steps)
dataset: gui360_balanced_train
dataset_dir: train_GUI_360/llamafactory/data
template: qwen2_vl
cutoff_len: 8192
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: train_GUI_360/llamafactory/output/gui360_balanced_lora_r256
logging_steps: 10
save_steps: 50
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
run_name: gui360_balanced_lora_r256

### train — eff_bs = 2 nodes * 4 gpu * 1 * 16 = 128
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: gui360_balanced_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
