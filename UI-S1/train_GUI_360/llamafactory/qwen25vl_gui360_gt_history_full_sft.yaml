### model - Qwen2.5-VL-7B base
model_name_or_path: checkpoints/Qwen2.5-VL-7B-Instruct
image_max_pixels: 200704
video_max_pixels: 16384
trust_remote_code: true

### method - full parameter SFT
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: train_GUI_360/llamafactory/ds_z3_config.json

### dataset - GUI-360 balanced
dataset: gui360_gt_history_train
dataset_dir: train_GUI_360/llamafactory/data
template: qwen2_vl
cutoff_len: 16384
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: train_GUI_360/llamafactory/output/gui360_gt_history_full_sft
logging_steps: 10
save_strategy: epoch
save_steps: 50
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
run_name: gui360_gt_history_full_sft

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1e-05
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.1
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: gui360_gt_history_val
per_device_eval_batch_size: 1
eval_strategy: epoch
eval_steps: 50
