### model
model_name_or_path: /scratch/a5l/shuqing.a5l/MobileAgent/UI-S1/checkpoints/Qwen2.5-VL-7B-Instruct
image_max_pixels: 401408
video_max_pixels: 16384
trust_remote_code: true

### method — vanilla LoRA SFT baseline with multi-turn trajectory data
# Same LoRA shape as cooperative v6.5 (r=256, alpha=512, 7 modules)
# Key difference from v6_5_ac_sft_baseline: multi-turn trajectory format
# that matches eval's gen_next_round() format (system message + multi-turn)
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 256
lora_alpha: 512
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true
freeze_multi_modal_projector: true
### dataset — multi-turn trajectory AC data
dataset: ac_multiturn_train
dataset_dir: train_GUI_360/llamafactory/data
template: qwen2_vl
cutoff_len: 32768
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: train_GUI_360/llamafactory/output/v6_5_ac_sft_multiturn
logging_steps: 5
save_steps: 50
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
run_name: v6_5_ac_sft_multiturn

### train — eff_bs = 2 nodes * 4 gpu * pdbs=1 * grad_accum=4 = 32 (DDP, no DeepSpeed)
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: ac_multiturn_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
