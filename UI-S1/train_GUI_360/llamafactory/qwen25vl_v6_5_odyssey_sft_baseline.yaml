### model
model_name_or_path: /scratch/a5l/shuqing.a5l/MobileAgent/UI-S1/checkpoints/Qwen2.5-VL-7B-Instruct
image_max_pixels: 1003520
video_max_pixels: 16384
trust_remote_code: true

### method — vanilla LoRA SFT baseline matching cooperative v6.5 per-agent shape
# Cooperative v6.5 uses: lora_r=256, alpha=512, dropout=0.05, all 7 modules, frozen vision+projector
# This baseline runs the SAME data + SAME LoRA shape but WITHOUT the cooperative wrapper /
# tanh communication gate, so any delta vs cooperative v6.5 isolates the value of the
# v6.5 communication mechanism.
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 256
lora_alpha: 512
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true
freeze_multi_modal_projector: true
deepspeed: train_GUI_360/llamafactory/ds_z3_config.json

### dataset — thought-augmented Odyssey data shared with cooperative_v6_5_odyssey
dataset: odyssey_thought_train
dataset_dir: train_GUI_360/llamafactory/data
template: qwen2_vl
cutoff_len: 4096
preprocessing_num_workers: 32
dataloader_num_workers: 16

### output
output_dir: train_GUI_360/llamafactory/output/v6_5_odyssey_sft_baseline
logging_steps: 10
save_steps: 100
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
run_name: v6_5_odyssey_sft_baseline

### train — eff_bs = 8 nodes * 4 gpu * pdbs=1 * grad_accum=4 = 128 (matches cooperative v6.5)
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: odyssey_thought_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
