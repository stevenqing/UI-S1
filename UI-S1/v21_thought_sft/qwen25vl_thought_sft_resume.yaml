### model — start from base Qwen2.5-VL-7B-Instruct (same as SFT-272)
model_name_or_path: /scratch/a5l/shuqing.a5l/MobileAgent/UI-S1/checkpoints/Qwen2.5-VL-7B-Instruct
image_max_pixels: 1003520
video_max_pixels: 16384
trust_remote_code: true

### method — full parameter SFT (identical to SFT-272)
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: train_GUI_360/llamafactory/ds_z3_config.json

### dataset — thought-augmented balanced 2K data (response = thought + tool_call)
dataset: gui360_thought_train
dataset_dir: train_GUI_360/llamafactory/data
template: qwen2_vl
cutoff_len: 8192
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: v21_thought_sft/output/thought_sft
logging_steps: 10
save_steps: 20
save_total_limit: 10
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none
run_name: v21_thought_sft

### train — eff_bs = 4 nodes * 4 gpu * 1 * 16 = 256 (same as SFT-272)
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.1
bf16: true
ddp_timeout: 180000000

### eval
eval_dataset: gui360_thought_val
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 20
